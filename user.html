<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Place Order</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#071525;color:#fff;font-family:Arial,sans-serif;padding:18px}
.order-wrap{max-width:760px;margin:auto}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.back{background:#172235;color:#fff;border:1px solid #29384f;padding:9px 13px;border-radius:10px;cursor:pointer}
.panel{background:#0f1b2d;border:1px solid #26344a;border-radius:16px;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.25)}
.panel-head{padding:20px;border-bottom:1px solid #26344a}
.panel-head h2{margin:0;color:#22c55e}
.panel-head p{margin:7px 0 0;opacity:.72}
.service-summary{display:grid;grid-template-columns:100px 1fr;gap:15px;padding:18px;border-bottom:1px solid #26344a}
.service-summary img{width:100px;height:100px;object-fit:cover;border-radius:12px;background:#172235}
.service-summary h3{margin:0 0 7px;color:#22c55e}
.service-summary p{margin:4px 0;opacity:.8;font-size:14px}
.service-summary .service-id-display{
  color:#38bdf8;
  font-weight:800;
  opacity:1;
  word-break:break-all;
}
.service-summary .service-category-display,
.service-summary .service-subcategory-display{
  color:#cbd5e1;
  opacity:1;
}
.meta-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:14px 18px}
.meta{background:#172235;border-radius:10px;padding:10px;font-size:12px;opacity:.8}
.meta strong{display:block;color:#fff;font-size:14px;margin-top:4px}
.form{padding:18px}
label{display:block;margin:14px 0 7px;font-weight:700}
input,textarea{width:100%;padding:13px;border:1px solid #334155;border-radius:10px;background:#172235;color:#fff;outline:none}
input:focus,textarea:focus{border-color:#22c55e}
textarea{min-height:100px;resize:vertical}
.total{font-size:22px;font-weight:800;color:#22c55e}
.order-btn{width:100%;padding:14px;border:0;border-radius:10px;background:#22c55e;color:#06130b;font-weight:900;font-size:17px;margin-top:18px;cursor:pointer}
.hint{font-size:12px;opacity:.65;margin-top:6px}
#quantitySection{display:none}
#quantityMeta{display:none}
#requiredInfoSection{display:none}
.required-mode-picker{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 14px}
.required-mode-option{display:flex;align-items:center;gap:9px;padding:12px 13px;border:1px solid rgba(255,255,255,.14);border-radius:12px;background:rgba(255,255,255,.04);cursor:pointer;font-size:14px;line-height:1.4}
.required-mode-option input{accent-color:#2563eb;margin:0}
.required-mode-option:has(input:checked){border-color:#2563eb;background:rgba(37,99,235,.12)}
@media(max-width:600px){.required-mode-picker{grid-template-columns:1fr}}
.dynamicField{margin-top:14px}
.dynamicField label{margin-top:0}
.required-title{color:#22c55e;font-size:18px;margin:20px 0 4px}
.required-note{font-size:12px;opacity:.65;margin:0 0 8px}
.required-box{margin-top:18px;padding:15px;border:1px solid #29405f;border-radius:14px;background:#111e31}
.required-box .required-title{margin:0 0 4px}
.dynamicField{margin-top:12px}
.dynamicField label{color:#e5e7eb;font-size:14px}
.dynamicInput{min-height:46px;font-size:15px}.dynamicTextarea{min-height:180px;line-height:1.6}.required-prompt{margin:8px 0 10px;padding:11px 12px;border-radius:10px;background:#172235;border:1px dashed #334155;color:#cbd5e1;line-height:1.7;font-size:14px;white-space:normal}.required-single-form{padding:12px 14px;border:1px solid #22c55e;border-radius:14px;background:#172235;overflow:hidden}.required-single-textarea{width:100%;min-height:420px;box-sizing:border-box;resize:vertical;background:#172235;border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:16px;color:#fff;line-height:1.65;font-size:16px;outline:none}.required-single-textarea:focus{border-color:#22c55e;box-shadow:0 0 0 1px rgba(34,197,94,.18)}.required-single-row{display:grid;grid-template-columns:minmax(125px,42%) minmax(0,1fr);gap:8px;align-items:center;padding:5px 0}.required-single-row label{margin:0;line-height:1.45;color:#f1f5f9}.required-single-row .dynamicInput{width:100%;min-width:0;box-sizing:border-box;background:transparent;border:0;border-radius:0;box-shadow:none;padding:7px 2px;color:#fff;outline:none;font-size:15px;min-height:38px}.required-single-row .dynamicInput::placeholder{color:#94a3b8;opacity:.7}.required-single-row .dynamicInput:focus{border:0;background:transparent;box-shadow:none}.required-single-row .dynamicInput:focus::placeholder{opacity:.45}@media(max-width:600px){.required-single-row{grid-template-columns:minmax(105px,40%) minmax(0,1fr);gap:6px}.required-single-row label{font-size:14px}.required-single-row .dynamicInput{font-size:14px;min-height:40px;padding:6px 1px}}
@media(max-width:560px){
  .service-summary{grid-template-columns:1fr}
  .service-summary img{width:80px;height:80px}
  .meta-grid{grid-template-columns:1fr 1fr}
  .meta:last-child{grid-column:1/-1}
}
</style>
</head>
<body>
<div class="order-wrap">
<div class="topbar">
<button class="back" onclick="history.back()">← Back</button>
<strong>JN IT CENTER</strong>
</div>

<div class="panel">
<div class="panel-head">
<h2>🛒 Place Service Order</h2>

</div>

<div class="service-summary">
<img id="serviceImage" alt="Service">
<div>
<h3 id="serviceTitle">Loading service...</h3>
<p id="serviceIdDisplay" class="service-id-display">Service ID: Loading...</p>
<p id="serviceCategoryDisplay" class="service-category-display">Category: Loading...</p>
<p id="serviceSubCategoryDisplay" class="service-subcategory-display">Sub Category: Loading...</p>
<p id="serviceDescription">Loading service details...</p>
</div>
</div>

<div class="meta-grid">
<div class="meta">Rate<strong id="rateDisplay">৳0</strong></div>
<div class="meta" id="quantityMeta">Minimum / Maximum<strong id="quantityLimitText">1 / 999999</strong></div>
<div class="meta">Delivery<strong id="deliveryDisplay">Automatic</strong></div>
</div>

<div class="form">

<div id="quantitySection">
<label for="quantity">Quantity</label>
<input type="number" id="quantity" min="1" value="1" inputmode="numeric">
<div id="quantityLimit" class="hint"></div>
</div>

<label for="totalPrice">Total Price</label>
<input class="total" type="text" id="totalPrice" readonly>

<div id="requiredInfoSection" class="required-box">
<h3 class="required-title">📋 প্রয়োজনীয় তথ্য</h3>
<p class="required-note">নিচের তথ্যগুলো পূরণ করে অর্ডার Submit করুন।</p>
<div id="dynamicFields"></div>
</div>

<button class="order-btn" id="placeOrderBtn">🛒 Order Now</button>
</div>
</div>
</div>

<link rel="stylesheet" href="popup.css">
<script src="popup.js"></script>
<script type="module" src="user.js"></script>
</body>
</html>
