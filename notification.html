<link rel="stylesheet" href="notification.css">

<!-- Notification Panel -->
<div id="notificationPanel" class="notification-panel">

    <!-- Header -->
    <div class="notification-header">

    <div class="header-left">

    <div class="bell-icon">🔔</div>

    <h3>
        Notifications
        <span id="notificationCount">(0)</span>
    </h3>

</div>

    <div class="header-buttons">

        <button id="markAllRead" class="mark-btn" title="Mark All Read">
            ✓
        </button>

        <button id="closeNotification" class="close-btn" title="Close">
            ✖
        </button>

    </div>

</div>

    <!-- Notification Body -->
    <div id="notificationList" class="notification-body">

        <div class="empty-state">

            <div class="empty-icon">🔔</div>

            <p>Loading...</p>

        </div>

    </div>

</div>

<!-- Toast -->
<div id="toastNotification" class="toast-notification"></div>

<script type="module" src="notification.js"></script>
