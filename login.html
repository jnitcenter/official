<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | JN IT CENTER</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="popup.css">

<style>

body{
    background:#081829;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    margin:0;
    font-family:Arial,sans-serif;
}

.login-box{
    width:400px;
    background:#111827;
    padding:35px;
    border-radius:20px;
    box-shadow:0 15px 40px rgba(0,0,0,.45);
}

.login-box h2{
    color:#2ecc71;
    text-align:center;
    margin-bottom:25px;
}

.login-box input{
    width:100%;
    padding:14px;
    margin-bottom:18px;
    border:none;
    border-radius:10px;
    background:#1d2f45;
    color:#fff;
    box-sizing:border-box;
}

.login-box input:focus{
    outline:2px solid #2ecc71;
}

.login-box button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#2ecc71;
    color:#fff;
    font-size:17px;
    cursor:pointer;
}

.login-box button:hover{
    background:#27ae60;
}

.login-box p{
    text-align:center;
    color:#ddd;
}

.login-box a{
    color:#2ecc71;
    text-decoration:none;
}

</style>

</head>

<body>

<div class="login-box">

<h2>Login</h2>

<input
type="text"
id="loginInput"
placeholder="Email or Username">

<input type="password" id="password" placeholder="Password">

<button id="loginBtn">
Login
</button>

<p style="text-align:center; margin-top:10px;">
    <a href="#" id="forgotPasswordBtn">Forgot Password?</a> </p>

</p> Don't have an account?

<a href="register1.html">

Register

</a>

</p>

</div>

<script src="popup.js"></script>
<script type="module" src="login.js"></script>

<!-- RESET PASSWORD POPUP -->

<div id="resetPasswordModal" class="user-modal">

    <div class="user-modal-content">

        <span class="close-modal" onclick="closeResetModal()">&times;</span>

        <h2>🔑 Reset Password</h2>

        <p>Enter your registered email</p>

        <input
            type="email"
            id="resetEmail"
            placeholder="example@gmail.com">

        <button id="sendResetBtn">
            Send Reset Link
        </button>

    </div>

</div>

</body>
</html>
