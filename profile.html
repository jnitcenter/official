<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Profile | JN IT CENTER</title>

<link rel="stylesheet" href="profile.css">

</head>

<body>

<div class="profile-container">

<div class="profile-card">

<h2>👤 My Profile</h2>

<img
id="profileImage"
src="images/default-user.png"
class="profile-image">

<div id="photoLinkModal" class="photo-link-modal" aria-hidden="true">
<div class="photo-link-box">
<h3>🔗 Add Profile Photo</h3>
<label for="photoLinkInput">Photo Link</label>
<input
type="url"
id="photoLinkInput"
placeholder="https://example.com/photo.jpg"
autocomplete="off">
<div class="photo-link-actions">
<button type="button" id="photoLinkCancel">Cancel</button>
<button type="button" id="photoLinkSave">Save Photo</button>
</div>
</div>
</div>

<button id="changePhotoBtn">

📷 Change Photo

</button>

<label>Full Name</label>

<input
type="text"
id="profileName">

<label>Username</label>

<input
type="text"
id="profileUsername">

<label>Email</label>

<input
type="email"
id="profileEmail"
readonly>

<label>Phone Number</label>

<input
type="text"
id="profilePhone">

<hr>

<h3>🔒 Change Password</h3>

<label>Current Password</label>

<input
type="password"
id="currentPassword">

<label>New Password</label>

<input
type="password"
id="newPassword">

<label>Confirm Password</label>

<input
type="password"
id="confirmPassword">

<button id="changePasswordBtn">

🔒 Change Password

</button>

<br><br>

<button id="saveProfileBtn">

💾 Save Changes

</button>

<br><br>

<a href="dashboard.html">

⬅ Back Dashboard

</a>

</div>

</div>

<script type="module" src="profile.js"></script>
<link rel="stylesheet" href="popup.css">
<script src="popup.js"></script>

</body>
</html>
