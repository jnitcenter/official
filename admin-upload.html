<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Upload Result | JN IT CENTER</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="admin.css">

</head>

<body>

<div class="upload-page">

<div class="upload-box">

<h2>📤 Upload Result</h2>

<input
type="hidden"
id="orderId">

<label>Result Delivery Method</label>
<div class="result-methods" style="display:grid;gap:12px;margin:10px 0 18px">
  <div style="padding:12px;border:1px solid #2b6f88;border-radius:10px">
    <strong>Option 1 — Google Drive Link</strong>
    <input type="url" id="resultLink" placeholder="Paste Google Drive share link" style="width:100%;margin-top:8px">
  </div>
  <div style="padding:12px;border:1px solid #2b6f88;border-radius:10px">
    <strong>Option 2 — Upload PDF</strong>
    <input type="file" id="resultPdf" accept="application/pdf,.pdf" style="width:100%;margin-top:8px">
    <small>PDF only, maximum 10 MB.</small>
    <div id="uploadStatus" role="status" aria-live="polite" style="margin-top:12px;font-weight:600"></div>
    <div id="uploadProgressWrap" style="display:none;margin-top:10px" aria-label="PDF upload progress">
      <div style="height:12px;background:#334155;border-radius:999px;overflow:hidden">
        <div id="uploadProgressBar" style="height:100%;width:0%;background:#22c55e;border-radius:999px;transition:width .2s ease"></div>
      </div>
      <div id="uploadProgressDetails" style="margin-top:7px;font-size:.9em;opacity:.9"></div>
      <div style="margin-top:8px;font-size:.9em;opacity:.9">ⓘ Please keep this page open while uploading.</div>
    </div>
  </div>
</div>

<label>Admin Note</label>

<textarea
id="adminNote"
placeholder="Write admin note..."></textarea>

<button class="green-btn" onclick="saveResult()">
    📤 Upload Result
</button>

<br><br>

<a
href="admin.html"
class="green-btn">

⬅ Back Dashboard

</a>

</div>

</div>

<script type="module" src="admin-upload.js"></script>

<div id="successPopup" class="success-popup">
    <div class="popup-box">
        <div class="popup-icon">✅</div>
        <h3>Result Uploaded!</h3>
        <p>Result Saved Successfully.</p>
    </div>
</div>

<div id="messagePopup" class="success-popup">
    <div class="popup-box">
        <div id="popupIcon" class="popup-icon">⚠️</div>
        <h3 id="popupTitle"></h3>
        <p id="popupText"></p>
    </div>
</div>

</body>

</html>
