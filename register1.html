<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Account | JN IT CENTER</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="popup.css">

<style>

body{
    margin:0;
    background:#081829;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.register-box{

    width:400px;
    background:#111827;
    border:1px solid rgba(255,255,255,.08);
    border-radius:20px;
    padding:35px;
    box-shadow:0 15px 40px rgba(0,0,0,.45);

}

.logo{

    text-align:center;
    margin-bottom:20px;

}

.logo img{

    width:100px;

}

h2{

    color:#2ecc71;
    text-align:center;
    margin-bottom:25px;

}

input{

    width:100%;
    padding:14px;
    margin-bottom:18px;
    border:none;
    border-radius:10px;
    background:#1d2f45;
    color:#fff;
    font-size:16px;
    box-sizing:border-box;

}

input:focus{

    outline:2px solid #2ecc71;

}

button{

    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#2ecc71;
    color:#fff;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;

}

button:hover{

    background:#27ae60;

}

p{

    text-align:center;
    color:#ddd;
    margin-top:20px;

}

a{

    color:#2ecc71;
    text-decoration:none;

}

</style>

</head>

<body>

<div class="register-box">

<div class="logo">
<img src="https://i.postimg.cc/jqfFRkWQ/preview.png" alt="Logo">
</div>

<h2>Create Account</h2>

<input type="text" id="name" placeholder="Full Name">

<input
    type="text"
    id="username"
    placeholder="Username"
    required>

<input type="email" id="email" placeholder="Email Address">

<input type="password" id="password" placeholder="Password">

<button id="registerBtn">
Create Account
</button>

<p>

Already have an account?

<a href="login.html">
Login
</a>

</p>

</div>

<script src="popup.js"></script>
<script type="module" src="auth.js"></script>

</body>
</html>
